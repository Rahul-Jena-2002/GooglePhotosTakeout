server.port=8081
spring.application.name=GoogleTakeoutMetadataRestorer
spring.main.headless=false
logging.level.org.springframework.web=INFO

# Spring Boot DevTools & LiveReload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.web.resources.cache.period=0

# Google OAuth2 OpenID Connect Configuration
# Credentials can be provided via environment variables: GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:takeoutfix-desktop.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:takeoutfix-desktop-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
