# General ProGuard Configuration for Spring Boot
-dontshrink
-dontoptimize
-useuniqueclassmembernames
-keeppackagenames
-keepattributes Signature,RuntimeVisibleAnnotations,AnnotationDefault,InnerClasses,EnclosingMethod,Deprecated,Exceptions

# Suppress warnings from platform and third-party classes
-dontwarn java.lang.management.**
-dontwarn com.sun.management.**
-dontwarn org.springframework.**
-dontwarn org.apache.commons.**
-dontwarn org.json.**
-dontwarn ch.qos.logback.**
-dontwarn org.slf4j.**
-dontwarn javax.servlet.**

# Keep the main application class
-keep public class com.rahul.TakeoutApplication {
    public static void main(java.lang.String[]);
}

# Keep Spring annotations and stereo-types
-keep @org.springframework.stereotype.Component class *
-keep @org.springframework.stereotype.Service class *
-keep @org.springframework.stereotype.Repository class *
-keep @org.springframework.stereotype.Controller class *
-keep @org.springframework.web.bind.annotation.RestController class *
-keep @org.springframework.context.annotation.Configuration class *
-keep @org.springframework.web.bind.annotation.ControllerAdvice class *

# Keep classes and members needed for websocket communication
-keep class com.rahul.config.WebSocketConfig { *; }

# Keep all serialization DTOs and models (if any are added later under a model package)
-keep class com.rahul.model.** { *; }

# Keep all public/protected methods and fields of Spring components so reflection, injection and autowiring work
-keepclassmembers class * {
    @org.springframework.beans.factory.annotation.Autowired *;
    @org.springframework.beans.factory.annotation.Value *;
    @org.springframework.context.annotation.Bean *;
    @org.springframework.context.event.EventListener *;
    @org.springframework.web.bind.annotation.RequestMapping *;
    @org.springframework.web.bind.annotation.GetMapping *;
    @org.springframework.web.bind.annotation.PostMapping *;
    @org.springframework.web.bind.annotation.PutMapping *;
    @org.springframework.web.bind.annotation.DeleteMapping *;
    @org.springframework.web.bind.annotation.ExceptionHandler *;
}

# Keep getters/setters and standard serialization methods for Jackson JSON mapping
-keepclassmembers class * {
    *** get*();
    void set*(***);
    *** is*();
}
