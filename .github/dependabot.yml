version: 2
updates:
  # Webapp frontend & core build tools
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "esbuild"
      - dependency-name: "sharp"

  # Webapp Cloud Functions
  - package-ecosystem: "npm"
    directory: "/webapp/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      function-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflows - grouped into single PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        patterns:
          - "*"
