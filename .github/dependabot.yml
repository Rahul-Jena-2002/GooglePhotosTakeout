version: 2
updates:
  # Webapp frontend & core build tools
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "esbuild"
      - dependency-name: "sharp"

  # Webapp Cloud Functions
  - package-ecosystem: "npm"
    directory: "/webapp/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      function-dependencies:
        patterns:
          - "*"

  # Native desktop app Java dependencies
  - package-ecosystem: "maven"
    directory: "/native"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # Skip pre-release versions
      - dependency-name: "org.slf4j:slf4j-api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.slf4j:slf4j-simple"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types: ["version-update:semver-major"]
      # Spring 7.x is a major breaking upgrade — stay on 6.x LTS
      - dependency-name: "org.springframework:spring-context"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows - grouped into single PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        patterns:
          - "*"
