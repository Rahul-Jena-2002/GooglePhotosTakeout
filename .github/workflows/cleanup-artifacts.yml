name: Cleanup Old Artifacts

on:
  workflow_dispatch:
    inputs:
      keep_recent:
        description: 'Number of recent versions to keep per artifact name (enter 0 to delete all)'
        required: false
        default: '1'
  schedule:
    - cron: '0 0 * * 0' # Weekly cleanup

permissions:
  actions: write

jobs:
  delete-artifacts:
    name: Purge Old Duplicate Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Keep Recent Artifacts and Delete Older Duplicates
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepInput = context.payload?.inputs?.keep_recent ?? '1';
            const keepCount = Math.max(0, parseInt(keepInput, 10));

            console.log(`Fetching all artifacts for ${owner}/${repo}...`);
            console.log(`Retention policy: Keeping ${keepCount} most recent version(s) per artifact name.`);

            const allArtifacts = [];
            try {
              for await (const response of github.paginate.iterator(
                github.rest.actions.listArtifactsForRepo,
                { owner, repo, per_page: 100 }
              )) {
                allArtifacts.push(...response.data);
              }
            } catch (fetchErr) {
              console.error(`Failed to fetch artifacts: ${fetchErr.message}`);
              throw fetchErr;
            }

            console.log(`Total artifacts found: ${allArtifacts.length}`);

            // Group artifacts by name (e.g. java-windows-latest, rust-windows-latest)
            const grouped = {};
            for (const art of allArtifacts) {
              if (!grouped[art.name]) grouped[art.name] = [];
              grouped[art.name].push(art);
            }

            let keptCount = 0;
            let deletedCount = 0;
            let freedBytes = 0;

            for (const [name, list] of Object.entries(grouped)) {
              // Sort descending by creation date (newest first)
              list.sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());

              const toKeep = list.slice(0, keepCount);
              const toDelete = list.slice(keepCount);

              for (const art of toKeep) {
                console.log(`[KEEP] ${art.name} (ID: ${art.id}, ${(art.size_in_bytes / (1024 * 1024)).toFixed(2)} MB, date: ${art.created_at})`);
                keptCount++;
              }

              for (const art of toDelete) {
                console.log(`[DELETE] ${art.name} (ID: ${art.id}, ${(art.size_in_bytes / (1024 * 1024)).toFixed(2)} MB, date: ${art.created_at})`);
                try {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: art.id,
                  });
                  deletedCount++;
                  freedBytes += art.size_in_bytes;
                } catch (delErr) {
                  console.warn(`Could not delete artifact ${art.id}: ${delErr.message}`);
                }
              }
            }

            console.log(`\n========================================`);
            console.log(`Cleanup Complete!`);
            console.log(`- Kept: ${keptCount} latest artifact(s)`);
            console.log(`- Deleted: ${deletedCount} older artifact(s)`);
            console.log(`- Storage Freed: ${(freedBytes / (1024 * 1024)).toFixed(2)} MB`);
            console.log(`========================================`);
