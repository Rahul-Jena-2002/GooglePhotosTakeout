name: Build & Release Pure Java Desktop Apps

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - rjdevelop
  pull_request:
    branches:
      - main
      - rjdevelop
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.2.4)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. PURE JAVA DESKTOP APP (Standalone Installers via Java 26 jpackage)
  # ════════════════════════════════════════════════════════════════════════════
  build-java:
    name: Java Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            primary_artifact: TakeoutFix.exe
          - os: macos-latest
            primary_artifact: TakeoutFix.dmg
          - os: ubuntu-latest
            primary_artifact: TakeoutFix.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Release Version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name || '2.2.6' }}"
          CLEAN_VER="${RAW_TAG#v}"
          # Validate that version consists only of numbers and dots (e.g., 2.2.6)
          if [[ ! "$CLEAN_VER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            # If triggered on a branch name like 'rjdevelop' or 'main', read pom.xml or use fallback
            if [ -f "takeoutfix/pom.xml" ]; then
              CLEAN_VER=$(grep -m1 '<version>' takeoutfix/pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/' | tr -d '\r')
            fi
            if [[ ! "$CLEAN_VER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              CLEAN_VER="2.2.6"
            fi
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Package version resolved: $CLEAN_VER"

      - name: Set up JDK 21 (Liberica with JavaFX)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk+fx'
          cache: 'maven'

      - name: Run Java Desktop Tests
        run: mvn test -f takeoutfix/pom.xml

      - name: Build Java Backend with Maven
        run: mvn clean package -DskipTests -f takeoutfix/pom.xml

      - name: Prepare jpackage Input
        shell: bash
        run: |
          mkdir -p jpackage-input
          cp takeoutfix/target/takeoutfix.jar jpackage-input/

      - name: Build Minimal Custom Runtime (jlink)
        shell: bash
        run: |
          jlink \
            --add-modules java.base,java.desktop,java.logging,java.naming,java.management,java.instrument,java.sql,java.xml,java.net.http,jdk.crypto.ec,jdk.unsupported,jdk.security.auth,javafx.base,javafx.controls,javafx.fxml,javafx.graphics,javafx.swing,javafx.media \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output custom-runtime

      # ─── Windows: Standalone EXE + Setup Installer (SmartScreen hardened) ───
      - name: Package Java Windows (.exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $appVer = "${{ steps.version.outputs.version }}"

          # 1. Build Native Application Image with Minimal Custom Runtime
          Write-Host "Building native application image with minimal custom runtime..."
          jpackage `
            --type app-image `
            --runtime-image "custom-runtime" `
            --input "jpackage-input" `
            --main-jar "takeoutfix.jar" `
            --main-class "com.takeoutfix.TakeoutFxApplication" `
            --name "TakeoutFix" `
            --icon "takeoutfix/icons/icon.ico" `
            --vendor "TakeoutFix" `
            --app-version "$appVer" `
            --dest "dist-app" `
            --verbose

          # 2. Package into Direct Standalone Single-File EXE (Zero-Install, Runs Immediately on Double-Click)
          Write-Host "Creating Direct Standalone TakeoutFix.exe (No Installation Wizard)..."
          $payloadZip = "dist-app\payload.zip"
          Compress-Archive -Path "dist-app\TakeoutFix\*" -DestinationPath $payloadZip -Force

          $cscPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $cscPath `
            "/target:winexe" `
            "/platform:x64" `
            "/win32icon:takeoutfix\icons\icon.ico" `
            "/win32manifest:takeoutfix\launcher\app.manifest" `
            "/reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll" `
            "/resource:$payloadZip,payload.zip" `
            "/out:TakeoutFix.exe" `
            "takeoutfix\launcher\SingleFileLauncher.cs"

          if (-not (Test-Path "TakeoutFix.exe")) {
            throw "TakeoutFix.exe compilation failed."
          }

          Remove-Item $payloadZip -Force

          # 3. Authenticode Code-Signing (Sets Publisher identity and DigiCert timestamp)
          if ($env:SIGNING_CERT_B64 -and $env:SIGNING_CERT_B64 -ne '') {
            Write-Host "Signing TakeoutFix.exe with Authenticode via secret PFX..."
            $certBytes = [Convert]::FromBase64String($env:SIGNING_CERT_B64)
            $pfxPath = Join-Path $env:TEMP "takeoutfix_sign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $certBytes)
            try {
              $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe"
              if (-not (Test-Path $signtool)) {
                $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              }
              & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:SIGNING_CERT_PASSWORD "TakeoutFix.exe"
              Write-Host "Signing complete via signtool."
            } finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "SIGNING_CERT_B64 secret not set — skipping code signing (build will remain unsigned to avoid self-signed ML trojan false positives)."
          }

          Write-Host "Done. Standalone direct runnable TakeoutFix.exe ready."

      # ─── macOS: Standalone DMG with Gatekeeper-compatible signing ───
      - name: Package Java macOS (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          APP_VER="${{ steps.version.outputs.version }}"

          # 1. Build app-image first to allow deep signing
          jpackage \
            --type app-image \
            --runtime-image custom-runtime \
            --name "TakeoutFix" \
            --input "jpackage-input" \
            --main-jar "takeoutfix.jar" \
            --main-class "com.takeoutfix.TakeoutFxApplication" \
            --icon "takeoutfix/icons/icon.icns" \
            --dest "dist-app" \
            --mac-package-identifier "com.takeoutfix.desktop" \
            --mac-package-name "TakeoutFix" \
            --vendor "TakeoutFix" \
            --copyright "Copyright 2026 TakeoutFix" \
            --app-version "$APP_VER" \
            --verbose

          # 2. Strip quarantine extended attributes (prevents Gatekeeper "damaged app" popup)
          xattr -cr "dist-app/TakeoutFix.app"

          # 3. Deep ad-hoc sign the bundle (no Apple Developer cert required; prevents Gatekeeper block)
          codesign --force --deep --sign - --options runtime "dist-app/TakeoutFix.app"
          # Verify signing succeeded
          codesign --verify --deep --strict "dist-app/TakeoutFix.app" && echo "Signing OK" || echo "Signing verify warning (non-fatal for ad-hoc)"

          # 4. Create DMG from signed app-image
          jpackage \
            --type dmg \
            --app-image "dist-app/TakeoutFix.app" \
            --name "TakeoutFix" \
            --icon "takeoutfix/icons/icon.icns" \
            --dest "dist-dmg" \
            --app-version "$APP_VER" \
            --vendor "TakeoutFix" \
            --mac-package-identifier "com.takeoutfix.desktop" \
            --verbose

          DMG_FILE=$(find dist-dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "jpackage DMG not found; searching dist-dmg..."
            find dist-dmg
            exit 1
          fi

          # 5. Ad-hoc sign the final DMG itself
          codesign --force --sign - "$DMG_FILE" || echo "DMG sign warning (non-fatal)"

          cp "$DMG_FILE" ./TakeoutFix.dmg
          echo "Generated & Signed: TakeoutFix.dmg (Version $APP_VER)"

      # ─── Linux: AppImage, DEB Package & Portable Archive ───
      - name: Package Java Linux (.AppImage & .deb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          APP_VER="${{ steps.version.outputs.version }}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends file binutils fakeroot

          # 1. Build app-image as the base for all Linux packages
          jpackage \
            --type app-image \
            --runtime-image custom-runtime \
            --name "TakeoutFix" \
            --input "jpackage-input" \
            --main-jar "takeoutfix.jar" \
            --main-class "com.takeoutfix.TakeoutFxApplication" \
            --icon "takeoutfix/icons/icon.png" \
            --dest "dist-linux" \
            --app-version "$APP_VER" \
            --vendor "TakeoutFix" \
            --verbose

          # 2. Build standalone AppImage using appimagetool
          rm -rf AppDir
          mkdir -p AppDir/usr AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          cp -r dist-linux/TakeoutFix/* AppDir/usr/
          cp takeoutfix/icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/takeoutfix.png
          cp takeoutfix/icons/icon.png AppDir/takeoutfix.png
          ln -sf takeoutfix.png AppDir/.DirIcon

          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=TakeoutFix' \
            'Exec=TakeoutFix' \
            'Icon=takeoutfix' \
            'Type=Application' \
            'Categories=Utility;Graphics;' \
            'Comment=Google Takeout Photo Metadata Restorer' \
            'Terminal=false' > AppDir/takeoutfix.desktop
          cp AppDir/takeoutfix.desktop AppDir/usr/share/applications/takeoutfix.desktop

          printf '%s\n' \
            '#!/bin/bash' \
            'HERE="$(dirname "$(readlink -f "${0}")")"' \
            'if [ -x "${HERE}/usr/bin/TakeoutFix" ]; then' \
            '  exec "${HERE}/usr/bin/TakeoutFix" "$@"' \
            'elif [ -x "${HERE}/usr/bin/takeoutfix" ]; then' \
            '  exec "${HERE}/usr/bin/takeoutfix" "$@"' \
            'else' \
            '  EXEC=$(find "${HERE}/usr" -maxdepth 3 -type f \( -name "TakeoutFix" -o -name "takeoutfix" \) | head -n 1)' \
            '  exec "$EXEC" "$@"' \
            'fi' > AppDir/AppRun
          chmod +x AppDir/AppRun
          find AppDir -type f \( -name "TakeoutFix" -o -name "takeoutfix" \) -exec chmod +x {} +

          export ARCH=x86_64
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir ./TakeoutFix.AppImage || {
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir ./TakeoutFix.AppImage
          }
          chmod +x ./TakeoutFix.AppImage
          echo "Generated: TakeoutFix.AppImage for Linux"

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: java-${{ matrix.os }}
          path: ${{ matrix.primary_artifact }}
          retention-days: 1

      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || 'latest' }}
          files: ${{ matrix.primary_artifact }}

  # ════════════════════════════════════════════════════════════════════════════
  # 2. RELEASE RETENTION POLICY: Retain current + previous 9 releases (10 total)
  # ════════════════════════════════════════════════════════════════════════════
  cleanup-old-releases:
    name: Retain Current + Previous 9 Releases (10 Total)
    needs: [build-java]
    runs-on: ubuntu-latest
    if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Prune Releases Older Than Current + Previous 9
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepCount = 10; // Current release + 9 previous = 10 total

            console.log(`Checking releases for ${owner}/${repo}... (Target retention: ${keepCount})`);

            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner,
                repo,
                per_page: 50,
              });

              if (releases.length <= keepCount) {
                console.log(`Only ${releases.length} releases found. No pruning needed.`);
                return;
              }

              const releasesToDelete = releases.slice(keepCount);
              console.log(`Pruning ${releasesToDelete.length} releases older than the 10 most recent...`);

              for (const release of releasesToDelete) {
                console.log(`Deleting release: ${release.tag_name} (ID: ${release.id})...`);
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id,
                });
                console.log(`Deleted release: ${release.tag_name}`);
              }
              console.log(`Release retention maintenance complete.`);
            } catch (error) {
              console.error(`Error maintaining release retention:`, error);
            }
