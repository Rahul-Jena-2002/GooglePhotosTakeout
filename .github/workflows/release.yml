name: Build Native Portable Apps

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Create Native App Image (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          jpackage --type app-image --name GTMetadataMerger --input target --main-jar GTakeout-1.0.0.jar --icon icons/icon.ico --dest dist
          Compress-Archive -Path dist/GTMetadataMerger -DestinationPath GTMetadataMerger-Windows-Portable.zip

      - name: Create Native App Image (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage --type app-image --name GTMetadataMerger --input target --main-jar GTakeout-1.0.0.jar --icon icons/icon.icns --dest dist
          cd dist
          zip -r ../GTMetadataMerger-macOS-Portable.zip GTMetadataMerger.app

      - name: Create Native App Image (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          jpackage --type app-image --name GTMetadataMerger --input target --main-jar GTakeout-1.0.0.jar --icon icons/icon.png --dest dist
          cd dist
          tar -czvf ../GTMetadataMerger-Linux-Portable.tar.gz GTMetadataMerger

      - name: Upload Windows Asset
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: GTMetadataMerger-Windows-Portable.zip

      - name: Upload macOS Asset
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: GTMetadataMerger-macOS-Portable.zip

      - name: Upload Linux Asset
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: GTMetadataMerger-Linux-Portable.tar.gz
