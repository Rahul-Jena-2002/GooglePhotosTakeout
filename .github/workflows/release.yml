name: Build & Release Pure Java Desktop Apps

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - rjdevelop
  pull_request:
    branches:
      - main
      - rjdevelop
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.1.8)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. PURE JAVA DESKTOP APP (Standalone Installers via Java 26 jpackage)
  # ════════════════════════════════════════════════════════════════════════════
  build-java:
    name: Java Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            primary_artifact: TakeoutFix.exe
            legacy_artifact: TakeoutFix-Java.exe
          - os: macos-latest
            primary_artifact: TakeoutFix.dmg
            legacy_artifact: TakeoutFix-Java.dmg
          - os: ubuntu-latest
            primary_artifact: TakeoutFix.AppImage
            legacy_artifact: TakeoutFix-Java.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name || '2.1.8' }}"
          CLEAN_VER="${RAW_TAG#v}"
          # Validate that version consists only of numbers and dots (e.g., 2.1.8)
          if [[ ! "$CLEAN_VER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            # If triggered on a branch name like 'rjdevelop' or 'main', read pom.xml or use fallback
            if [ -f "takeoutfix/pom.xml" ]; then
              CLEAN_VER=$(grep -m1 '<version>' takeoutfix/pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/' | tr -d '\r')
            fi
            if [[ ! "$CLEAN_VER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              CLEAN_VER="2.1.8"
            fi
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Package version resolved: $CLEAN_VER"

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Run Java Desktop Tests
        run: mvn test -f takeoutfix/pom.xml

      - name: Build Java Backend with Maven
        run: mvn clean package -DskipTests -f takeoutfix/pom.xml

      - name: Prepare jpackage Input
        shell: bash
        run: |
          mkdir -p jpackage-input
          cp takeoutfix/target/takeoutfix.jar jpackage-input/

      # ─── Windows: Standalone EXE + Setup Installer (SmartScreen hardened) ───
      - name: Package Java Windows (.exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $appVer = "${{ steps.version.outputs.version }}"

          # 1. Build Native Application Image
          Write-Host "Building native application image..."
          jpackage `
            --type app-image `
            --input "jpackage-input" `
            --main-jar "takeoutfix.jar" `
            --main-class "com.takeoutfix.TakeoutApplication" `
            --name "TakeoutFix" `
            --icon "takeoutfix/icons/icon.ico" `
            --vendor "TakeoutFix" `
            --app-version "$appVer" `
            --dest "dist-app" `
            --verbose

          # 2. Build Standalone Single-File EXE
          # /win32manifest  → Option 2: embeds app.manifest so Windows sees a known, trusted app identity
          # /win32icon      → branded icon in Explorer/taskbar
          # AssemblyVersion in .cs → populates EXE Properties > Details tab (FileVersion, Company, etc.)
          Write-Host "Compiling TakeoutFix.exe with embedded manifest + version resource..."
          $payloadZip = "dist-app\payload.zip"
          Compress-Archive -Path "dist-app\TakeoutFix\*" -DestinationPath $payloadZip -Force

          $cscPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $cscPath `
            "/target:winexe" `
            "/win32icon:takeoutfix\icons\icon.ico" `
            "/win32manifest:takeoutfix\launcher\app.manifest" `
            "/reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll" `
            "/resource:$payloadZip,payload.zip" `
            "/out:TakeoutFix.exe" `
            "takeoutfix\launcher\SingleFileLauncher.cs"

          if (-not (Test-Path "TakeoutFix.exe")) {
            throw "TakeoutFix.exe compilation failed."
          }

          # 3. Self-sign with a temp Authenticode cert (changes "Unknown Publisher" → "TakeoutFix")
          #    This is NOT EV signing — SmartScreen warning may still appear but is clickable.
          Write-Host "Self-signing TakeoutFix.exe with temporary Authenticode cert..."
          try {
            $cert = New-SelfSignedCertificate `
              -Subject "CN=TakeoutFix, O=TakeoutFix, C=US" `
              -Type CodeSigningCert `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(2) `
              -HashAlgorithm SHA256
            $thumbprint = $cert.Thumbprint
            Set-AuthenticodeSignature -FilePath "TakeoutFix.exe" -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
            Write-Host "Signed TakeoutFix.exe with cert thumbprint: $thumbprint"
          } catch {
            Write-Host "Self-signing step failed (non-fatal): $_"
          }

          Copy-Item "TakeoutFix.exe" "TakeoutFix-Java.exe" -Force
          Remove-Item $payloadZip -Force

          # 5. Build WiX Setup Installer — PRIMARY download (installers have higher SmartScreen reputation)
          Write-Host "Generating TakeoutFix-Setup.exe installer (PRIMARY download)..."
          jpackage `
            --type exe `
            --app-image "dist-app/TakeoutFix" `
            --name "TakeoutFix" `
            --icon "takeoutfix/icons/icon.ico" `
            --app-version "$appVer" `
            --vendor "TakeoutFix" `
            --copyright "Copyright 2026 TakeoutFix" `
            --description "Google Takeout Photo Metadata Restorer" `
            --dest "dist-exe" `
            --win-per-user-install `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --verbose

          # Rename setup installer to TakeoutFix-Setup.exe
          $generatedSetup = Get-ChildItem "dist-exe/*.exe" | Select-Object -First 1
          if ($generatedSetup) {
            Copy-Item $generatedSetup.FullName "./TakeoutFix-Setup.exe" -Force
            Write-Host "Setup installer: $($generatedSetup.Name) → TakeoutFix-Setup.exe"
          }
          Write-Host "Done. Artifacts: TakeoutFix.exe (standalone), TakeoutFix-Setup.exe (installer / primary)"

      # ─── macOS: Standalone DMG with Gatekeeper-compatible signing ───
      - name: Package Java macOS (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          APP_VER="${{ steps.version.outputs.version }}"

          # 1. Build app-image first to allow deep signing
          jpackage \
            --type app-image \
            --name "TakeoutFix" \
            --input "jpackage-input" \
            --main-jar "takeoutfix.jar" \
            --main-class "com.takeoutfix.TakeoutApplication" \
            --icon "takeoutfix/icons/icon.icns" \
            --dest "dist-app" \
            --mac-package-identifier "com.takeoutfix.desktop" \
            --mac-package-name "TakeoutFix" \
            --vendor "TakeoutFix" \
            --copyright "Copyright 2026 TakeoutFix" \
            --app-version "$APP_VER" \
            --verbose

          # 2. Strip quarantine extended attributes (prevents Gatekeeper "damaged app" popup)
          xattr -cr "dist-app/TakeoutFix.app"

          # 3. Deep ad-hoc sign the bundle (no Apple Developer cert required; prevents Gatekeeper block)
          codesign --force --deep --sign - --options runtime "dist-app/TakeoutFix.app"
          # Verify signing succeeded
          codesign --verify --deep --strict "dist-app/TakeoutFix.app" && echo "Signing OK" || echo "Signing verify warning (non-fatal for ad-hoc)"

          # 4. Create DMG from signed app-image
          jpackage \
            --type dmg \
            --name "TakeoutFix" \
            --app-image "dist-app/TakeoutFix.app" \
            --icon "takeoutfix/icons/icon.icns" \
            --dest "dist-dmg" \
            --mac-package-identifier "com.takeoutfix.desktop" \
            --mac-package-name "TakeoutFix" \
            --app-version "$APP_VER" \
            --verbose

          DMG_FILE=$(find dist-dmg -name "*.dmg" | head -n 1)

          # 5. Strip quarantine from DMG and ad-hoc sign it too
          xattr -cr "$DMG_FILE"
          codesign --force --sign - "$DMG_FILE" || echo "DMG sign warning (non-fatal)"

          cp "$DMG_FILE" ./TakeoutFix.dmg
          cp "$DMG_FILE" ./TakeoutFix-Java.dmg
          echo "Generated & Signed: TakeoutFix.dmg (Version $APP_VER)"

      # ─── Linux: AppImage, DEB Package & Portable Archive ───
      - name: Package Java Linux (.AppImage, .deb, .tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          APP_VER="${{ steps.version.outputs.version }}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot

          # 1. Build base app-image
          jpackage \
            --type app-image \
            --name "TakeoutFix" \
            --input "jpackage-input" \
            --main-jar "takeoutfix.jar" \
            --main-class "com.takeoutfix.TakeoutApplication" \
            --icon "takeoutfix/icons/icon.png" \
            --vendor "TakeoutFix" \
            --dest "dist-linux" \
            --app-version "$APP_VER" \
            --verbose

          # 2. Build native Debian/Ubuntu package (.deb) - 1-click install, bypasses missing libfuse2 issues
          jpackage \
            --type deb \
            --name "takeoutfix" \
            --app-image "dist-linux/TakeoutFix" \
            --icon "takeoutfix/icons/icon.png" \
            --vendor "TakeoutFix" \
            --description "Google Takeout Photo Metadata Restorer" \
            --dest "dist-deb" \
            --linux-shortcut \
            --linux-menu-group "Utility" \
            --app-version "$APP_VER" \
            --verbose || true

          if [ -d "dist-deb" ]; then
            DEB_FILE=$(find dist-deb -name "*.deb" | head -n 1)
            if [ -n "$DEB_FILE" ]; then
              cp "$DEB_FILE" ./TakeoutFix.deb
              cp "$DEB_FILE" ./TakeoutFix-Java.deb
            fi
          fi

          # 3. Package as self-extracting single-file AppImage runner
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist-linux/TakeoutFix/* AppDir/usr/lib/
          chmod +x AppDir/usr/lib/bin/TakeoutFix
          cp takeoutfix/icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/takeoutfix.png
          cp takeoutfix/icons/icon.png AppDir/takeoutfix.png

          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/lib/bin/TakeoutFix" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          printf '[Desktop Entry]\nName=TakeoutFix\nExec=TakeoutFix\nIcon=takeoutfix\nType=Application\nCategories=Utility;\nComment=Google Takeout Photo Metadata Restorer\nTerminal=false\n' > AppDir/takeoutfix.desktop

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir ./TakeoutFix.AppImage || {
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir ./TakeoutFix.AppImage
          }
          chmod +x ./TakeoutFix.AppImage
          cp ./TakeoutFix.AppImage ./TakeoutFix-Java.AppImage

          # 4. Portable tar.gz archive (runs on any Linux without FUSE or root privileges)
          tar -czf ./TakeoutFix-Linux-Portable.tar.gz -C dist-linux TakeoutFix
          echo "Generated: AppImage, DEB package, and Portable tar.gz for Linux"

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: java-${{ matrix.os }}
          path: |
            ${{ matrix.primary_artifact }}
            ${{ matrix.legacy_artifact }}
            TakeoutFix-Setup.exe
            *.deb
            *.tar.gz
          retention-days: 1

      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || 'latest' }}
          files: |
            ${{ matrix.primary_artifact }}
            ${{ matrix.legacy_artifact }}
            TakeoutFix-Setup.exe
            *.deb
            *.tar.gz

  # ════════════════════════════════════════════════════════════════════════════
  # 2. RELEASE RETENTION POLICY: Retain current + previous 9 releases (10 total)
  # ════════════════════════════════════════════════════════════════════════════
  cleanup-old-releases:
    name: Retain Current + Previous 9 Releases (10 Total)
    needs: [build-java]
    runs-on: ubuntu-latest
    if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Prune Releases Older Than Current + Previous 9
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepCount = 10; // Current release + 9 previous = 10 total

            console.log(`Checking releases for ${owner}/${repo}... (Target retention: ${keepCount})`);

            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner,
                repo,
                per_page: 50,
              });

              if (releases.length <= keepCount) {
                console.log(`Only ${releases.length} releases found. No pruning needed.`);
                return;
              }

              const releasesToDelete = releases.slice(keepCount);
              console.log(`Pruning ${releasesToDelete.length} releases older than the 10 most recent...`);

              for (const rel of releasesToDelete) {
                console.log(`Deleting release: ${rel.tag_name} (ID: ${rel.id})...`);
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: rel.id,
                });

                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${rel.tag_name}`,
                  });
                  console.log(`Deleted corresponding tag ref: ${rel.tag_name}`);
                } catch (tagErr) {
                  console.log(`Tag ref ${rel.tag_name} may have already been removed.`);
                }
              }
              console.log("Cleanup complete!");
            } catch (err) {
              console.error("Error during release cleanup:", err);
            }
