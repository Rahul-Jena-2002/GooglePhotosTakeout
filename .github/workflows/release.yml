name: Build Native Portable Apps

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Prepare Clean Packaging Input
        run: |
          mkdir jpackage-input
          cp target/GTakeout-1.0.0.jar jpackage-input/

      - name: Create Native App Image (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          jpackage `
            --type app-image `
            --name TakeoutFix `
            --input jpackage-input `
            --main-jar GTakeout-1.0.0.jar `
            --main-class com.rahul.TakeoutApplication `
            --icon icons/icon.ico `
            --dest dist `
            --vendor "TakeoutFix" `
            --app-version "1.0.0" `
            --description "Google Takeout Photo Metadata Restorer" `
            --about-url "https://takeoutfix.com" `
            --win-console `
            --verbose
          Compress-Archive -Path dist/TakeoutFix -DestinationPath TakeoutFix-Windows-Portable.zip

      - name: Create Native App Image (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage --type app-image --name TakeoutFix --input jpackage-input --main-jar GTakeout-1.0.0.jar --main-class com.rahul.TakeoutApplication --icon icons/icon.icns --dest dist --mac-package-identifier com.takeoutfix.desktop --verbose
          cd dist
          zip -r ../TakeoutFix-macOS-Portable.zip TakeoutFix.app

      - name: Create Native App Image (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          jpackage --type app-image --name TakeoutFix --input jpackage-input --main-jar GTakeout-1.0.0.jar --main-class com.rahul.TakeoutApplication --icon icons/icon.png --dest dist --verbose
          cd dist
          tar -czvf ../TakeoutFix-Linux-Portable.tar.gz TakeoutFix

      - name: Upload Windows Asset to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: TakeoutFix-Windows-Portable.zip

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TakeoutFix-Windows
          path: TakeoutFix-Windows-Portable.zip

      - name: Upload Windows to Cloudflare R2
        if: matrix.os == 'windows-latest' && env.R2_ENDPOINT != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 cp TakeoutFix-Windows-Portable.zip s3://${{ env.R2_BUCKET }}/windows/TakeoutFix-Windows-Portable.zip --endpoint-url ${{ env.R2_ENDPOINT }}

      - name: Upload macOS Asset to Release
        if: matrix.os == 'macos-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: TakeoutFix-macOS-Portable.zip

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TakeoutFix-macOS
          path: TakeoutFix-macOS-Portable.zip

      - name: Upload macOS to Cloudflare R2
        if: matrix.os == 'macos-latest' && env.R2_ENDPOINT != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 cp TakeoutFix-macOS-Portable.zip s3://${{ env.R2_BUCKET }}/macos/TakeoutFix-macOS-Portable.zip --endpoint-url ${{ env.R2_ENDPOINT }}

      - name: Upload Linux Asset to Release
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: TakeoutFix-Linux-Portable.tar.gz

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TakeoutFix-Linux
          path: TakeoutFix-Linux-Portable.tar.gz

      - name: Upload Linux to Cloudflare R2
        if: matrix.os == 'ubuntu-latest' && env.R2_ENDPOINT != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 cp TakeoutFix-Linux-Portable.tar.gz s3://${{ env.R2_BUCKET }}/linux/TakeoutFix-Linux-Portable.tar.gz --endpoint-url ${{ env.R2_ENDPOINT }}
