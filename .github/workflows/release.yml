name: Build Native Portable Apps & MSI Installers

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Test Suite
        run: mvn clean test

  build:
    name: Build on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Prepare Clean Packaging Input
        shell: bash
        run: |
          mkdir -p jpackage-input
          cp native/target/GTakeout-1.0.0.jar jpackage-input/
          cp native/target/GTakeout-1.0.0.jar ./TakeoutFix-Universal.jar

      - name: Create Native App Image & MSI Installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 1. Portable App Folder & Zip
          jpackage `
            --type app-image `
            --name TakeoutFix `
            --input jpackage-input `
            --main-jar GTakeout-1.0.0.jar `
            --main-class com.rahul.TakeoutApplication `
            --icon native/icons/icon.ico `
            --dest dist `
            --vendor "TakeoutFix" `
            --app-version "1.0.0" `
            --win-console `
            --verbose
          Compress-Archive -Path dist/TakeoutFix -DestinationPath TakeoutFix-Windows-Portable.zip

          # 2. Windows MSI Installer (per-user install, runs without admin certificate restriction)
          jpackage `
            --type msi `
            --name TakeoutFix `
            --input jpackage-input `
            --main-jar GTakeout-1.0.0.jar `
            --main-class com.rahul.TakeoutApplication `
            --icon native/icons/icon.ico `
            --dest dist-msi `
            --vendor "TakeoutFix" `
            --app-version "1.0.0" `
            --description "Google Takeout Photo Metadata Restorer" `
            --about-url "https://takeoutfix.com" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --win-per-user-install `
            --verbose
          Move-Item dist-msi/*.msi ./TakeoutFix-Setup.msi

      - name: Create Native App Image & Installers (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # 1. Portable App Image & Zip
          jpackage \
            --type app-image \
            --name TakeoutFix \
            --input jpackage-input \
            --main-jar GTakeout-1.0.0.jar \
            --main-class com.rahul.TakeoutApplication \
            --icon native/icons/icon.icns \
            --dest dist \
            --mac-package-identifier com.takeoutfix.desktop \
            --vendor "TakeoutFix" \
            --app-version "1.0.0" \
            --verbose

          # Zero-certificate launcher script removing quarantine attribute so Gatekeeper allows immediate launch
          echo '#!/bin/bash' > dist/Run-TakeoutFix.command
          echo 'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' >> dist/Run-TakeoutFix.command
          echo 'xattr -cr "$DIR/TakeoutFix.app" 2>/dev/null || true' >> dist/Run-TakeoutFix.command
          echo 'open "$DIR/TakeoutFix.app"' >> dist/Run-TakeoutFix.command
          chmod +x dist/Run-TakeoutFix.command
          cd dist
          zip -r ../TakeoutFix-macOS-Portable.zip TakeoutFix.app Run-TakeoutFix.command
          cd ..

          # 2. Native macOS DMG Installer
          jpackage \
            --type dmg \
            --name TakeoutFix \
            --input jpackage-input \
            --main-jar GTakeout-1.0.0.jar \
            --main-class com.rahul.TakeoutApplication \
            --icon native/icons/icon.icns \
            --dest dist-dmg \
            --mac-package-identifier com.takeoutfix.desktop \
            --vendor "TakeoutFix" \
            --app-version "1.0.0" \
            --description "Google Takeout Photo Metadata Restorer" \
            --verbose
          mv dist-dmg/*.dmg ./TakeoutFix-macOS.dmg

      - name: Create Native App Image & Packages (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install rpm tools for generating .rpm package
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm fakeroot

          # 1. Portable App Image & Tarball
          jpackage \
            --type app-image \
            --name TakeoutFix \
            --input jpackage-input \
            --main-jar GTakeout-1.0.0.jar \
            --main-class com.rahul.TakeoutApplication \
            --icon native/icons/icon.png \
            --dest dist \
            --vendor "TakeoutFix" \
            --app-version "1.0.0" \
            --verbose

          echo '#!/bin/bash' > dist/TakeoutFix/run.sh
          echo 'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' >> dist/TakeoutFix/run.sh
          echo 'exec "$DIR/bin/TakeoutFix" "$@"' >> dist/TakeoutFix/run.sh
          chmod +x dist/TakeoutFix/run.sh
          chmod +x dist/TakeoutFix/bin/TakeoutFix
          cd dist
          tar -czvf ../TakeoutFix-Linux-Portable.tar.gz TakeoutFix
          cd ..

          # 2. Debian / Ubuntu .deb Package
          jpackage \
            --type deb \
            --name takeoutfix \
            --input jpackage-input \
            --main-jar GTakeout-1.0.0.jar \
            --main-class com.rahul.TakeoutApplication \
            --icon native/icons/icon.png \
            --dest dist-deb \
            --vendor "TakeoutFix" \
            --app-version "1.0.0" \
            --description "Google Takeout Photo Metadata Restorer" \
            --linux-shortcut \
            --linux-menu-group "Utility" \
            --verbose
          mv dist-deb/*.deb ./TakeoutFix-Linux.deb

          # 3. Fedora / RHEL / openSUSE .rpm Package
          jpackage \
            --type rpm \
            --name takeoutfix \
            --input jpackage-input \
            --main-jar GTakeout-1.0.0.jar \
            --main-class com.rahul.TakeoutApplication \
            --icon native/icons/icon.png \
            --dest dist-rpm \
            --vendor "TakeoutFix" \
            --app-version "1.0.0" \
            --description "Google Takeout Photo Metadata Restorer" \
            --linux-shortcut \
            --linux-menu-group "Utility" \
            --verbose
          mv dist-rpm/*.rpm ./TakeoutFix-Linux.rpm

      - name: Upload Windows Asset to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TakeoutFix-Setup.msi
            TakeoutFix-Windows-Portable.zip
            TakeoutFix-Universal.jar

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TakeoutFix-Windows
          path: |
            TakeoutFix-Setup.msi
            TakeoutFix-Windows-Portable.zip
            TakeoutFix-Universal.jar

      - name: Upload macOS Asset to Release
        if: matrix.os == 'macos-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TakeoutFix-macOS.dmg
            TakeoutFix-macOS-Portable.zip

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TakeoutFix-macOS
          path: |
            TakeoutFix-macOS.dmg
            TakeoutFix-macOS-Portable.zip

      - name: Upload Linux Asset to Release
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TakeoutFix-Linux.deb
            TakeoutFix-Linux.rpm
            TakeoutFix-Linux-Portable.tar.gz

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TakeoutFix-Linux
          path: |
            TakeoutFix-Linux.deb
            TakeoutFix-Linux.rpm
            TakeoutFix-Linux-Portable.tar.gz
