name: Build Native Portable Apps

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Create Native App Image (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          jpackage --type app-image --name GTMetadataMerger --input target --main-jar GTakeout-1.0.0.jar --icon icons/icon.ico --dest dist
          Compress-Archive -Path dist/GTMetadataMerger -DestinationPath GTMetadataMerger-Windows-Portable.zip

      - name: Create Native App Image (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage --type app-image --name GTMetadataMerger --input target --main-jar GTakeout-1.0.0.jar --icon icons/icon.icns --dest dist
          cd dist
          zip -r ../GTMetadataMerger-macOS-Portable.zip GTMetadataMerger.app

      - name: Create Native App Image (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          jpackage --type app-image --name GTMetadataMerger --input target --main-jar GTakeout-1.0.0.jar --icon icons/icon.png --dest dist
          cd dist
          tar -czvf ../GTMetadataMerger-Linux-Portable.tar.gz GTMetadataMerger

      - name: Upload Windows Asset to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: GTMetadataMerger-Windows-Portable.zip

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GTMetadataMerger-Windows
          path: GTMetadataMerger-Windows-Portable.zip

      - name: Upload Windows to Cloudflare R2
        if: matrix.os == 'windows-latest'
        run: aws s3 cp GTMetadataMerger-Windows-Portable.zip s3://${{ secrets.R2_BUCKET }}/windows/TakeoutFix-Windows-Portable.zip --endpoint-url ${{ secrets.R2_ENDPOINT }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Upload macOS Asset to Release
        if: matrix.os == 'macos-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: GTMetadataMerger-macOS-Portable.zip

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GTMetadataMerger-macOS
          path: GTMetadataMerger-macOS-Portable.zip

      - name: Upload macOS to Cloudflare R2
        if: matrix.os == 'macos-latest'
        run: aws s3 cp GTMetadataMerger-macOS-Portable.zip s3://${{ secrets.R2_BUCKET }}/macos/TakeoutFix-macOS-Portable.zip --endpoint-url ${{ secrets.R2_ENDPOINT }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Upload Linux Asset to Release
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: GTMetadataMerger-Linux-Portable.tar.gz

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GTMetadataMerger-Linux
          path: GTMetadataMerger-Linux-Portable.tar.gz

      - name: Upload Linux to Cloudflare R2
        if: matrix.os == 'ubuntu-latest'
        run: aws s3 cp GTMetadataMerger-Linux-Portable.tar.gz s3://${{ secrets.R2_BUCKET }}/linux/TakeoutFix-Linux-Portable.tar.gz --endpoint-url ${{ secrets.R2_ENDPOINT }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
