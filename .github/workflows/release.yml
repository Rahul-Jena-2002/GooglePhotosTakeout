name: Build & Release Pure Java Desktop Apps

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.1.8)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. PURE JAVA DESKTOP APP (Standalone Installers via jpackage)
  # ════════════════════════════════════════════════════════════════════════════
  build-java:
    name: Java Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            primary_artifact: TakeoutFix.exe
            legacy_artifact: TakeoutFix-Java.exe
          - os: macos-latest
            primary_artifact: TakeoutFix.dmg
            legacy_artifact: TakeoutFix-Java.dmg
          - os: ubuntu-latest
            primary_artifact: TakeoutFix.AppImage
            legacy_artifact: TakeoutFix-Java.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name || '2.1.7' }}"
          CLEAN_VER="${RAW_TAG#v}"
          if [[ "$CLEAN_VER" == "main" || "$CLEAN_VER" == "latest" || -z "$CLEAN_VER" ]]; then
            # Extract version from version.properties if available
            if [ -f "native/src/main/resources/version.properties" ]; then
              CLEAN_VER=$(grep "app.version" native/src/main/resources/version.properties | cut -d'=' -f2 | tr -d '\r')
            else
              CLEAN_VER="2.1.7"
            fi
          fi
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Package version resolved: $CLEAN_VER"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Java Backend with Maven
        run: mvn clean package -DskipTests

      - name: Prepare jpackage Input
        shell: bash
        run: |
          mkdir -p jpackage-input
          cp native/target/takeoutfix.jar jpackage-input/

      # ─── Windows: Direct Standalone EXE Installer ───
      - name: Package Java Windows (.exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $appVer = "${{ steps.version.outputs.version }}"
          jpackage `
            --type exe `
            --name "TakeoutFix" `
            --input "jpackage-input" `
            --main-jar "takeoutfix.jar" `
            --main-class "com.takeoutfix.TakeoutApplication" `
            --icon "native/icons/icon.ico" `
            --app-version "$appVer" `
            --dest "dist-exe" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --verbose

          $generatedExe = Get-ChildItem "dist-exe/*.exe" | Select-Object -First 1
          Copy-Item $generatedExe.FullName "./TakeoutFix.exe" -Force
          Copy-Item $generatedExe.FullName "./TakeoutFix-Java.exe" -Force
          Write-Host "Generated: TakeoutFix.exe and TakeoutFix-Java.exe (Version $appVer)"

      # ─── macOS: Direct Standalone DMG ───
      - name: Package Java macOS (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          APP_VER="${{ steps.version.outputs.version }}"
          jpackage \
            --type dmg \
            --name "TakeoutFix" \
            --input "jpackage-input" \
            --main-jar "takeoutfix.jar" \
            --main-class "com.takeoutfix.TakeoutApplication" \
            --icon "native/icons/icon.icns" \
            --dest "dist-dmg" \
            --mac-package-identifier "com.takeoutfix.desktop" \
            --app-version "$APP_VER" \
            --verbose

          DMG_FILE=$(find dist-dmg -name "*.dmg" | head -n 1)
          cp "$DMG_FILE" ./TakeoutFix.dmg
          cp "$DMG_FILE" ./TakeoutFix-Java.dmg
          echo "Generated: TakeoutFix.dmg and TakeoutFix-Java.dmg (Version $APP_VER)"

      # ─── Linux: Direct AppImage / Package ───
      - name: Package Java Linux (.AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          APP_VER="${{ steps.version.outputs.version }}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot

          # 1. Build app-image
          jpackage \
            --type app-image \
            --name "TakeoutFix" \
            --input "jpackage-input" \
            --main-jar "takeoutfix.jar" \
            --main-class "com.takeoutfix.TakeoutApplication" \
            --icon "native/icons/icon.png" \
            --dest "dist-linux" \
            --app-version "$APP_VER" \
            --verbose

          # 2. Package as self-extracting single-file AppImage runner
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist-linux/TakeoutFix/* AppDir/usr/lib/
          cp native/icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/takeoutfix.png
          cp native/icons/icon.png AppDir/takeoutfix.png

          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/lib/bin/TakeoutFix" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          printf '[Desktop Entry]\nName=TakeoutFix\nExec=TakeoutFix\nIcon=takeoutfix\nType=Application\nCategories=Utility;\nComment=Google Takeout Photo Metadata Restorer\n' > AppDir/takeoutfix.desktop

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir ./TakeoutFix.AppImage || {
            # Fallback if FUSE is unavailable on runner
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir ./TakeoutFix.AppImage
          }
          cp ./TakeoutFix.AppImage ./TakeoutFix-Java.AppImage
          echo "Generated: TakeoutFix.AppImage and TakeoutFix-Java.AppImage (Version $APP_VER)"

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: java-${{ matrix.os }}
          path: |
            ${{ matrix.primary_artifact }}
            ${{ matrix.legacy_artifact }}
          retention-days: 1

      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || 'latest' }}
          files: |
            ${{ matrix.primary_artifact }}
            ${{ matrix.legacy_artifact }}

  # ════════════════════════════════════════════════════════════════════════════
  # 2. RELEASE RETENTION POLICY: Retain current + previous 9 releases (10 total)
  # ════════════════════════════════════════════════════════════════════════════
  cleanup-old-releases:
    name: Retain Current + Previous 9 Releases (10 Total)
    needs: [build-java]
    runs-on: ubuntu-latest
    if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Prune Releases Older Than Current + Previous 9
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepCount = 10; // Current release + 9 previous = 10 total

            console.log(`Fetching all releases for ${owner}/${repo}...`);
            let allReleases = [];
            try {
              for await (const response of github.paginate.iterator(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 100 }
              )) {
                allReleases.push(...response.data);
              }
            } catch (err) {
              console.error(`Failed to fetch releases: ${err.message}`);
              throw err;
            }

            // Exclude drafts, sort descending by published_at / created_at
            const publishedReleases = allReleases
              .filter(r => !r.draft)
              .sort((a, b) => new Date(b.published_at || b.created_at).getTime() - new Date(a.published_at || a.created_at).getTime());

            console.log(`Total published releases found: ${publishedReleases.length}`);

            // Safety guard: if the latest release has no uploaded assets, do NOT prune older releases
            const newestRelease = publishedReleases[0];
            if (!newestRelease || !newestRelease.assets || newestRelease.assets.length === 0) {
              console.log(`⚠️ Newest release ${newestRelease?.tag_name || 'unknown'} has no assets yet. Aborting cleanup to preserve existing releases.`);
              return;
            }

            const toKeep = publishedReleases.slice(0, keepCount);
            const toDelete = publishedReleases.slice(keepCount);

            console.log(`\nReleases to KEEP (${toKeep.length}):`);
            for (const r of toKeep) {
              console.log(`✓ [KEEP] ${r.tag_name} (${r.name || 'No title'}) published at ${r.published_at || r.created_at}`);
            }

            if (toDelete.length === 0) {
              console.log(`\nNo older releases to delete. Total count is within retention limit (${keepCount}).`);
              return;
            }

            console.log(`\nReleases to DELETE (${toDelete.length}):`);
            let deletedCount = 0;
            for (const r of toDelete) {
              console.log(`✗ [DELETING] ${r.tag_name} (ID: ${r.id}, published: ${r.published_at || r.created_at})`);
              try {
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: r.id,
                });
                deletedCount++;
              } catch (delErr) {
                console.warn(`  - Failed to delete release ${r.tag_name}: ${delErr.message}`);
              }
            }

            console.log(`\n========================================`);
            console.log(`Release Cleanup Complete!`);
            console.log(`- Retained: ${toKeep.length} active releases`);
            console.log(`- Deleted: ${deletedCount} older releases and their binary assets`);
            console.log(`========================================`);
