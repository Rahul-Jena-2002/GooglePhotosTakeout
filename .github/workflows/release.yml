name: Build Native Rust (Tauri) & Java Desktop Apps

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.0.9)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. RUST NATIVE TAURI EDITION (Primary Desktop: Windows, macOS, Linux)
  # ════════════════════════════════════════════════════════════════════════════
  build-rust-tauri:
    name: Rust Tauri Edition (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TakeoutFix.exe
          - os: macos-latest
            artifact_name: TakeoutFix.dmg
          - os: ubuntu-latest
            artifact_name: TakeoutFix.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: webapp/src-tauri -> target

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Webapp NPM Dependencies
        working-directory: webapp
        run: npm ci

      - name: Build Tauri Desktop App
        working-directory: webapp
        run: npx @tauri-apps/cli build

      # ─── Windows: Copy Standalone Executable ───
      - name: Prepare Windows Rust Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Check standalone release binary or NSIS setup
          if (Test-Path "webapp/src-tauri/target/release/TakeoutFix.exe") {
            Copy-Item "webapp/src-tauri/target/release/TakeoutFix.exe" "./TakeoutFix.exe" -Force
          } elseif (Test-Path "webapp/src-tauri/target/release/app.exe") {
            Copy-Item "webapp/src-tauri/target/release/app.exe" "./TakeoutFix.exe" -Force
          } elseif (Test-Path "webapp/src-tauri/target/release/bundle/nsis/*.exe") {
            $nsisExe = Get-ChildItem "webapp/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
            Copy-Item $nsisExe.FullName "./TakeoutFix.exe" -Force
          } elseif (Test-Path "webapp/src-tauri/target/release/bundle/msi/*.msi") {
            $msi = Get-ChildItem "webapp/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
            Copy-Item $msi.FullName "./TakeoutFix.exe" -Force
          }
          Write-Host "Prepared: TakeoutFix.exe"

      # ─── macOS: Copy Universal DMG ───
      - name: Prepare macOS Rust DMG
        if: matrix.os == 'macos-latest'
        run: |
          DMG_FILE=$(find webapp/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          cp "$DMG_FILE" ./TakeoutFix.dmg
          echo "Prepared: TakeoutFix.dmg"

      # ─── Linux: Copy AppImage ───
      - name: Prepare Linux Rust AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          APPIMAGE_FILE=$(find webapp/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1)
          cp "$APPIMAGE_FILE" ./TakeoutFix.AppImage
          echo "Prepared: TakeoutFix.AppImage"

      - name: Upload Rust Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rust-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

      - name: Attach Rust Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || 'latest' }}
          files: ${{ matrix.artifact_name }}

  # ════════════════════════════════════════════════════════════════════════════
  # 2. ANDROID EDITION (Tauri Mobile APK)
  # ════════════════════════════════════════════════════════════════════════════
  build-android:
    name: Android Edition (APK)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          fi
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NDK_PATH" ]; then
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: webapp/src-tauri -> target

      - name: Install Webapp NPM Dependencies
        working-directory: webapp
        run: npm ci

      - name: Build Android APK
        working-directory: webapp
        run: |
          npx @tauri-apps/cli android init --ci || true
          npx @tauri-apps/cli android build --apk --target aarch64 --ci || npx @tauri-apps/cli android build --apk --target aarch64 --debug --ci

      - name: Prepare APK Binary
        run: |
          APK_PATH=$(find webapp/src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" ./TakeoutFix.apk
            echo "Prepared: TakeoutFix.apk from $APK_PATH"
          else
            echo "No APK found in build outputs."
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: TakeoutFix.apk
          retention-days: 1

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || 'latest' }}
          files: TakeoutFix.apk

  # ════════════════════════════════════════════════════════════════════════════
  # 3. JAVA DESKTOP EDITION (Standalone Direct Runnable via jpackage)
  # ════════════════════════════════════════════════════════════════════════════
  build-java:
    name: Java Edition (${{ matrix.os }})
    needs: [build-rust-tauri]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TakeoutFix-Java.exe
          - os: macos-latest
            artifact_name: TakeoutFix-Java.dmg
          - os: ubuntu-latest
            artifact_name: TakeoutFix-Java.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Java Backend with Maven
        run: mvn clean package -DskipTests

      - name: Prepare jpackage Input
        shell: bash
        run: |
          mkdir -p jpackage-input
          cp native/target/takeoutfix.jar jpackage-input/

      # ─── Windows: Direct Standalone EXE Installer ───
      - name: Package Java Windows (.exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name "TakeoutFix-Java" `
            --input "jpackage-input" `
            --main-jar "takeoutfix.jar" `
            --main-class "com.takeoutfix.TakeoutApplication" `
            --icon "native/icons/icon.ico" `
            --app-version "2.0.9" `
            --dest "dist-exe" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --verbose

          $generatedExe = Get-ChildItem "dist-exe/*.exe" | Select-Object -First 1
          Copy-Item $generatedExe.FullName "./TakeoutFix-Java.exe" -Force
          Write-Host "Generated: TakeoutFix-Java.exe"

      # ─── macOS: Direct Standalone DMG ───
      - name: Package Java macOS (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage \
            --type dmg \
            --name "TakeoutFix-Java" \
            --input "jpackage-input" \
            --main-jar "takeoutfix.jar" \
            --main-class "com.takeoutfix.TakeoutApplication" \
            --icon "native/icons/icon.icns" \
            --dest "dist-dmg" \
            --mac-package-identifier "com.takeoutfix.desktop" \
            --app-version "2.0.9" \
            --verbose

          cp dist-dmg/*.dmg ./TakeoutFix-Java.dmg
          echo "Generated: TakeoutFix-Java.dmg"

      # ─── Linux: Direct AppImage / Package ───
      - name: Package Java Linux (.AppImage & .deb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot

          # 1. Build app-image
          jpackage \
            --type app-image \
            --name "TakeoutFix-Java" \
            --input "jpackage-input" \
            --main-jar "takeoutfix.jar" \
            --main-class "com.takeoutfix.TakeoutApplication" \
            --icon "native/icons/icon.png" \
            --dest "dist-linux" \
            --app-version "2.0.9" \
            --verbose

          # 2. Package as self-extracting single-file AppImage runner
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist-linux/TakeoutFix-Java/* AppDir/usr/lib/
          cp native/icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/takeoutfix.png
          cp native/icons/icon.png AppDir/takeoutfix.png

          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/lib/bin/TakeoutFix-Java" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          printf '[Desktop Entry]\nName=TakeoutFix-Java\nExec=TakeoutFix-Java\nIcon=takeoutfix\nType=Application\nCategories=Utility;\nComment=Google Takeout Photo Metadata Restorer\n' > AppDir/takeoutfix.desktop

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir ./TakeoutFix-Java.AppImage || {
            # Fallback if FUSE is unavailable on runner
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir ./TakeoutFix-Java.AppImage
          }

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: java-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

      - name: Attach Java Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || 'latest' }}
          files: ${{ matrix.artifact_name }}

  # ════════════════════════════════════════════════════════════════════════════
  # 4. RELEASE RETENTION POLICY: Retain current + previous 2 releases (3 total)
  # ════════════════════════════════════════════════════════════════════════════
  cleanup-old-releases:
    name: Retain Current + Previous 2 Releases
    needs: [build-rust-tauri, build-android, build-java]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Prune Releases Older Than Current + Previous 2
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepCount = 3; // Current release + 2 previous = 3 total

            console.log(`Fetching all releases for ${owner}/${repo}...`);
            let allReleases = [];
            try {
              for await (const response of github.paginate.iterator(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 100 }
              )) {
                allReleases.push(...response.data);
              }
            } catch (err) {
              console.error(`Failed to fetch releases: ${err.message}`);
              throw err;
            }

            // Exclude drafts, sort descending by published_at / created_at
            const publishedReleases = allReleases
              .filter(r => !r.draft)
              .sort((a, b) => new Date(b.published_at || b.created_at).getTime() - new Date(a.published_at || a.created_at).getTime());

            console.log(`Total published releases found: ${publishedReleases.length}`);

            const toKeep = publishedReleases.slice(0, keepCount);
            const toDelete = publishedReleases.slice(keepCount);

            console.log(`\nReleases to KEEP (${toKeep.length}):`);
            for (const r of toKeep) {
              console.log(`✓ [KEEP] ${r.tag_name} (${r.name || 'No title'}) published at ${r.published_at || r.created_at}`);
            }

            if (toDelete.length === 0) {
              console.log(`\nNo older releases to delete. Total count is within retention limit (${keepCount}).`);
              return;
            }

            console.log(`\nReleases to DELETE (${toDelete.length}):`);
            let deletedCount = 0;
            for (const r of toDelete) {
              console.log(`✗ [DELETING] ${r.tag_name} (ID: ${r.id}, published: ${r.published_at || r.created_at})`);
              try {
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: r.id,
                });
                deletedCount++;
              } catch (delErr) {
                console.warn(`  - Failed to delete release ${r.tag_name}: ${delErr.message}`);
              }
            }

            console.log(`\n========================================`);
            console.log(`Release Cleanup Complete!`);
            console.log(`- Retained: ${toKeep.length} active releases`);
            console.log(`- Deleted: ${deletedCount} older releases and their binary assets`);
            console.log(`========================================`);
